spring:
  jpa:
    hibernate:
      # Entities and changesets must not drift apart.
      ddl-auto: validate

argus:
  admin:
    key: integration-test-admin-key-0123456789abcdef
  poll:
    cron: "-"

management:
  opentelemetry:
    tracing:
      export:
        # The default 5s batch delay would slow the trace export test.
        schedule-delay: 100ms
