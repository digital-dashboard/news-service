spring:
  liquibase:
    contexts: test
  jpa:
    hibernate:
      # Entities and changesets must not drift apart.
      ddl-auto: validate

argus:
  admin:
    key: integration-test-admin-key-0123456789abcdef
  fetch:
    retry:
      # Keeps the back-off of ITs that exercise failing feeds short; max-retries stays at its default of 2.
      delay: 10ms
  poll:
    cron: "-"
    concurrency: 2

management:
  opentelemetry:
    tracing:
      export:
        # The default 5s batch delay would slow the trace export test.
        schedule-delay: 100ms
