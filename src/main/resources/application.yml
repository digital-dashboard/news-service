spring:
  application:
    name: argus
  config:
    import: optional:configtree:/run/secrets/
  datasource:
    url: ${argus.db.url}
    username: ${argus.db.username}
    password: ${argus.db.password}
    hikari:
      pool-name: argus-pool
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  sql:
    init:
      mode: never
  web:
    resources:
      add-mappings: false
  lifecycle:
    timeout-per-shutdown-phase: 30s
  task:
    scheduling:
      shutdown:
        # Boot's default, kept explicit: closing the scheduler interrupts a running poll instead of awaiting it.
        await-termination: false
  http:
    clients:
      connect-timeout: ${ARGUS_FETCH_CONNECT_TIMEOUT:5s}
      read-timeout: ${ARGUS_FETCH_READ_TIMEOUT:15s}
      # FeedFetcher follows redirects itself so it can validate every hop.
      redirects: dont-follow

server:
  port: 8080
  shutdown: graceful

# Swarm secrets arrive as files under /run/secrets and are bound by the configtree import above.
argus:
  db:
    url: ${ARGUS_DB_URL:}
    username: ${ARGUS_DB_USERNAME:${argus_db_username:}}
    password: ${ARGUS_DB_PASSWORD:${argus_db_password:}}
  admin:
    key: ${ARGUS_ADMIN_KEY:${argus_admin_key:}}
  fetch:
    # Not Maven-filtered: the version here is a literal.
    # Avoid scraper words such as "aggregator": CBC's CDN resets requests whose User-Agent contains them.
    user-agent: ${ARGUS_FETCH_USER_AGENT:Argus/0.1 (self-hosted RSS reader)}
    max-body-size: ${ARGUS_FETCH_MAX_BODY_SIZE:5MB}
    max-redirects: ${ARGUS_FETCH_MAX_REDIRECTS:5}
    retry:
      max-retries: ${ARGUS_FETCH_RETRY_MAX_RETRIES:2}
      delay: ${ARGUS_FETCH_RETRY_DELAY:1s}
      multiplier: ${ARGUS_FETCH_RETRY_MULTIPLIER:2.0}
      timeout: ${ARGUS_FETCH_RETRY_TIMEOUT:25s}
  poll:
    cron: ${ARGUS_POLL_CRON:0 */15 * * * *}
    concurrency: ${ARGUS_POLL_CONCURRENCY:8}
    failing-threshold: ${ARGUS_POLL_FAILING_THRESHOLD:3}
  telemetry:
    otlp-base-url: ${ARGUS_OTLP_BASE_URL:http://tempo:4318}
    sampling-probability: ${ARGUS_TRACING_SAMPLING_PROBABILITY:1.0}

logging:
  structured:
    format:
      console: logstash

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  observations:
    enable:
      # Filter-chain spans would otherwise show up as orphan root traces for the actuator requests.
      spring.security: false
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
        hikaricp.connections.acquire: true
        argus: true
  otlp:
    metrics:
      export:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false
  tracing:
    sampling:
      probability: ${argus.telemetry.sampling-probability}
  opentelemetry:
    # ARGUS_OTLP_BASE_URL is the only source for the trace endpoint.
    map-environment-variables: false
    tracing:
      export:
        otlp:
          # Used verbatim by Boot, so the signal path is appended here.
          endpoint: ${argus.telemetry.otlp-base-url}/v1/traces
