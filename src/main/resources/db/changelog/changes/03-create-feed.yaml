databaseChangeLog:
  - changeSet:
      id: 03-create-feed
      author: argus
      changes:
        - createTable:
            tableName: feed
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_feed
              - column:
                  name: source_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_feed_source
                    references: source(id)
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: url
                  type: text
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_feed_url
              - column:
                  name: site_url
                  type: text
              - column:
                  name: topic
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: language
                  type: varchar(16)
              - column:
                  name: enabled
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
        - createIndex:
            indexName: ix_feed_source
            tableName: feed
            columns:
              - column:
                  name: source_id
      rollback:
        - dropTable:
            tableName: feed
