  # Fragment: merge into the scrape_configs list of the stack's promtail-config.yml.
  # Promtail runs with -config.expand-env=true, so this file must never contain a dollar sign.
  - job_name: argus
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      - source_labels: ['__meta_docker_container_label_com_docker_swarm_service_name']
        regex: '(?:.+_)?argus'
        action: keep
      - source_labels: ['__meta_docker_container_label_com_docker_swarm_service_name']
        regex: '(?:.+_)?(.+)'
        target_label: service
      - source_labels: ['__meta_docker_container_label_com_docker_stack_namespace']
        target_label: stack
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: stream
      - source_labels: ['__meta_docker_container_label_com_docker_swarm_node_id']
        target_label: node_id
    pipeline_stages:
      - docker: {}
      - json:
          expressions:
            level: level
            logger: logger_name
            traceId: traceId
            # Quoted because of the @; unquoted, the field is never found and the timestamp falls back.
            ts: '"@timestamp"'
      # traceId is extracted but never promoted: it is unbounded. Grafana's derived field reads it from the line.
      - labels:
          level:
      - timestamp:
          source: ts
          format: RFC3339Nano
          action_on_failure: fudge
