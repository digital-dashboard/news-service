# Mirrors the live stack's datasource provisioning (uids, Loki derived field, Tempo tracesToLogsV2).
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
      httpMethod: POST

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
      derivedFields:
        - name: TraceID
          datasourceUid: tempo
          matcherRegex: '"(?:traceId|trace_id)"\s*:\s*"([a-f0-9]{16,32})"'
          url: '$${__value.raw}'
          urlDisplayLabel: 'View trace'

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      httpMethod: GET
      tracesToLogsV2:
        datasourceUid: loki
        tags:
          - key: 'service.name'
            value: 'service'
        filterByTraceID: true
        filterBySpanID: false
        spanStartTimeShift: '-2m'
        spanEndTimeShift: '2m'
      tracesToMetrics:
        datasourceUid: prometheus
        tags:
          - key: 'service.name'
            value: 'service'
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
